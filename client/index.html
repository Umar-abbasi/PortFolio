<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Umar Abbasi — Web, Android & ERP Specialist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<div id="root"></div>
<script>
window.addEventListener('error', function(e){
  localStorage.setItem('__debug_err', JSON.stringify({message:e.message, filename:e.filename, lineno:e.lineno, colno:e.colno, stack: e.error && e.error.stack}));
});
window.addEventListener('unhandledrejection', function(e){
  localStorage.setItem('__debug_rej', JSON.stringify({reason:String(e.reason), stack: e.reason && e.reason.stack}));
});
</script>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
